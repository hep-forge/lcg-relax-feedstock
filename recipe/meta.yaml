{% set versions = {
    "6.1.2": "f91b81404c13da7d8ae92f2720f1b2ef0170116f16bc89a2bfd49179f7d33251"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}
{% set root_tag = (root or '')|replace('.', '') %}

{% set name = environ.get('ANACONDA_PACKAGE', 'lcg-relax')|string|lower %}

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}

source:
  url: "https://lcgpackages.web.cern.ch/tarFiles/sources/RELAX-{{ version }}.tar.gz"
  {% if versions.get(version, None) %}
  sha256: {{ versions.get(version) }}
  {% endif %}
  # From conda-forge's lcg-relax recipe: ROOT 6 generates the dictionaries
  # with rootcling, so GCCXML isn't needed; build shared libraries.
  patches:
    - patches/0001-remove-gccxml-dependency.patch
    - patches/0002-use-shared-library-type.patch

build:
  number: 0
  string: "root{{ root_tag }}"
  skip: true  # [not linux]
  ignore_prefix_files:
    - lib/*.pcm
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - ninja
  host:
    - root {{ root }}.*
    - root-guard
    - clhep
    - gsl
  run:
    - root {{ root }}.*
    - root-guard

test:
  commands:
    - test -f "${PREFIX}/lib/libCLHEPRflx.so"
    - test -f "${PREFIX}/lib/libMathRflx.so"
    - test -f "${PREFIX}/lib/libMathAddRflx.so"
    - test -f "${PREFIX}/lib/libSTLRflx.so"
    - test -f "${PREFIX}/lib/libSTLAddRflx.so"

about:
  home: https://lcginfo.cern.ch/pkg/RELAX/
  license: LGPL-2.0-or-later
  license_file: README.md
  summary: ROOT dictionaries for CLHEP, HepMC, ROOT Math and STL containers

extra:
  recipe-maintainers:
    - meiyasan
